name: Bug
description: Reportar un fallo reproducible.
title: "fix: "
body:
  - type: markdown
    attributes:
      value: No incluyas secretos, credenciales ni datos personales innecesarios.
  - type: textarea
    id: problem
    attributes:
      label: Problema observado
      description: Qué ocurre y qué esperabas que ocurriera.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Pasos para reproducir
      description: Indica datos y condiciones controlados; evita depender de red real en tests.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Entorno
      description: Commit o rama, versión de iOS, dispositivo o simulador y Xcode.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidencia y alcance
      description: Logs relevantes, capturas, impacto y comprobaciones pendientes.
